version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node --version
        - cd maternal-health-ai && npm ci
    build:
      commands:
        - cd maternal-health-ai && npm run build
  artifacts:
    baseDirectory: maternal-health-ai/dist
    files:
      - '**/*'
  cache:
    paths:
      - maternal-health-ai/node_modules/**/*
